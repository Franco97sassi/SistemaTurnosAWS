name: Deploy Sistema Turnos AWS

concurrency:
  group: production
  cancel-in-progress: false

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sistema-turnos-api
  ECS_CLUSTER: turnos-cluster
  ECS_SERVICE: turnos-backend-service
  CONTAINER_NAME: backend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: SistemaTurnosAWS/backend/requirements-dev.txt

      - name: Test backend
        working-directory: SistemaTurnosAWS/backend
        run: |
          pip install -r requirements-dev.txt
          pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SistemaTurnosAWS/frontend/package-lock.json

      - name: Check frontend
        working-directory: SistemaTurnosAWS/frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.0"

      - name: Validate Terraform
        working-directory: SistemaTurnosAWS/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  deploy-backend:
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REPOSITORY=$AWS_ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          docker build -t $REPOSITORY:${{ github.sha }} -t $REPOSITORY:latest ./SistemaTurnosAWS/backend
          docker push $REPOSITORY --all-tags

      - name: Create immutable task definition
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REPOSITORY=$AWS_ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          aws ecs describe-task-definition --task-definition turnos-backend \
            --query taskDefinition > task-definition.json
          jq --arg IMAGE "$REPOSITORY:${{ github.sha }}" --arg NAME "${{ env.CONTAINER_NAME }}" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) |
             (.containerDefinitions[] | select(.name == $NAME) | .image) = $IMAGE' \
            task-definition.json > rendered-task-definition.json
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://rendered-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "TASK_DEFINITION_ARN=$TASK_DEFINITION_ARN" >> "$GITHUB_ENV"

      - name: Deploy and verify backend
        run: |
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --task-definition "$TASK_DEFINITION_ARN" >/dev/null
          aws ecs wait services-stable --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build frontend
        env:
          VITE_API_URL: ""
        run: |
          cd SistemaTurnosAWS/frontend
          npm ci
          npm run build

      - name: Upload frontend to S3
        run: aws s3 sync SistemaTurnosAWS/frontend/dist s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Production smoke test
        run: |
          CLOUDFRONT_URL=$(aws cloudfront get-distribution \
            --id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --query 'Distribution.DomainName' --output text)
          curl --fail --retry 5 --retry-delay 10 "https://$CLOUDFRONT_URL/health"
