name: Deploy Sistema Turnos AWS

concurrency:
  group: production
  cancel-in-progress: false

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sistema-turnos-api
  ECS_CLUSTER: turnos-cluster
  ECS_SERVICE: turnos-backend-service
  ECS_TASK_FAMILY: turnos-backend
  CONTAINER_NAME: backend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: SistemaTurnosAWS/backend/requirements-dev.txt

      - name: Test backend
        working-directory: SistemaTurnosAWS/backend
        env:
          PYTHONPATH: ${{ github.workspace }}/SistemaTurnosAWS/backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SistemaTurnosAWS/frontend/package-lock.json

      - name: Check frontend
        working-directory: SistemaTurnosAWS/frontend
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.0"

      - name: Validate Terraform
        working-directory: SistemaTurnosAWS/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  deploy-backend:
    runs-on: ubuntu-latest
    needs: quality
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AWS authentication
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [[ -n "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "Using GitHub OIDC to assume the deployment role."
          elif [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "Using the configured AWS access keys."
          else
            echo "::error::AWS authentication is incomplete. Configure AWS_DEPLOY_ROLE_ARN (recommended), or both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        if: env.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: env.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REPOSITORY=$AWS_ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          docker build -t $REPOSITORY:${{ github.sha }} -t $REPOSITORY:latest ./SistemaTurnosAWS/backend
          docker push $REPOSITORY --all-tags

      - name: Resolve deployed task definition
        run: |
          set -euo pipefail
          echo "AWS identity: $(aws sts get-caller-identity --query Arn --output text)"
          echo "ECS region: ${{ env.AWS_REGION }}"
          echo "ECS cluster/service: ${{ env.ECS_CLUSTER }}/${{ env.ECS_SERVICE }}"

          SERVICE_TASK_DEFINITION=$(aws ecs describe-services \
            --region "${{ env.AWS_REGION }}" \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --query 'services[0].taskDefinition' --output text)

          if [[ -z "$SERVICE_TASK_DEFINITION" || "$SERVICE_TASK_DEFINITION" == "None" ]]; then
            echo "::error::The ECS service does not exist in the configured account/region. Provision the Terraform infrastructure first."
            exit 1
          fi

          aws ecs describe-task-definition \
            --region "${{ env.AWS_REGION }}" \
            --task-definition "$SERVICE_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

          DEPLOYED_FAMILY=$(jq -r '.family' task-definition.json)
          if [[ "$DEPLOYED_FAMILY" != "${{ env.ECS_TASK_FAMILY }}" ]]; then
            echo "::error::ECS service uses task family '$DEPLOYED_FAMILY'; expected '${{ env.ECS_TASK_FAMILY }}'."
            exit 1
          fi

      - name: Register immutable task definition revision
        run: |
          set -euo pipefail
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REPOSITORY=$AWS_ACCOUNT_ID.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          jq --exit-status --arg NAME "${{ env.CONTAINER_NAME }}" \
            '.containerDefinitions[] | select(.name == $NAME)' task-definition.json >/dev/null

          # Derive an allowlist from the installed AWS CLI service model. This keeps every
          # supported RegisterTaskDefinition input while excluding describe-only metadata.
          REGISTER_TASK_DEFINITION_KEYS=$(aws ecs register-task-definition \
            --generate-cli-skeleton input | jq --compact-output 'keys')
          jq --arg IMAGE "$REPOSITORY:${{ github.sha }}" \
            --arg NAME "${{ env.CONTAINER_NAME }}" \
            --argjson ALLOWED_KEYS "$REGISTER_TASK_DEFINITION_KEYS" \
            'with_entries(select(.key as $key | $ALLOWED_KEYS | index($key))) |
             (.containerDefinitions[] | select(.name == $NAME) | .image) = $IMAGE' \
            task-definition.json > rendered-task-definition.json
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --region "${{ env.AWS_REGION }}" \
            --cli-input-json file://rendered-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "TASK_DEFINITION_ARN=$TASK_DEFINITION_ARN" >> "$GITHUB_ENV"

      - name: Deploy and verify backend
        env:
          ECS_DEPLOY_TIMEOUT_SECONDS: "1200"
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}" \
            --task-definition "$TASK_DEFINITION_ARN" >/dev/null
          .github/scripts/wait-for-ecs-deployment.sh "$TASK_DEFINITION_ARN"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    env:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate AWS authentication
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [[ -n "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo "Using GitHub OIDC to assume the deployment role."
          elif [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "Using the configured AWS access keys."
          else
            echo "::error::AWS authentication is incomplete. Configure AWS_DEPLOY_ROLE_ARN (recommended), or both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        if: env.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials with access keys
        if: env.AWS_DEPLOY_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build frontend
        env:
          VITE_API_URL: ""
        run: |
          cd SistemaTurnosAWS/frontend
          npm ci
          npm run build

      - name: Upload frontend to S3
        run: aws s3 sync SistemaTurnosAWS/frontend/dist s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Production smoke test
        run: |
          CLOUDFRONT_URL=$(aws cloudfront get-distribution \
            --id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --query 'Distribution.DomainName' --output text)
          curl --fail --retry 5 --retry-delay 10 "https://$CLOUDFRONT_URL/"
